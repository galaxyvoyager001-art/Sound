<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>听见从前</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="corner" aria-hidden="true"></div>
    <div id="start">
      <div class="start-card">
        <div class="start-title">听见从前</div>
        <div class="start-hint">请工作人员点一下屏幕开始</div>
      </div>
    </div>
    <aside id="staff">
      <h3>工作人员面板 <small>（按 S 键关闭）</small></h3>
      <div id="staff-status">等待开始</div>
      <div id="staff-level"></div>
      <div class="row">
        <input id="staff-text" placeholder="演示/测试：输入老人说的话" />
        <button id="staff-send">发送</button>
      </div>
      <div class="row">
        <button id="staff-quiet">安静</button>
        <button id="staff-unquiet">恢复声音</button>
        <button id="staff-end">结束会谈</button>
      </div>
      <div class="row">
        <label>音量上限 <input id="staff-volume" type="range" min="0" max="100" /></label>
        <label><input id="staff-autolook" type="checkbox" checked /> 自动环顾</label>
        <select id="staff-pan">
          <option value="equalpower">外放（等功率声像）</option>
          <option value="HRTF">耳机（HRTF）</option>
        </select>
      </div>
      <div id="staff-log"></div>
    </aside>
    <script type="module" src="/src/session/main.ts"></script>
  </body>
</html>
