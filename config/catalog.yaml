  - {key: 收音机调台, zh: [收音机杂音, 调台], en: [radio tuning static, shortwave radio static], mode: event, interval: [40, 120], gain: -14, profile: old_radio}
  - {key: 老歌, zh: [老歌, 民歌, 茉莉花], en: [chinese folk song, erhu folk melody, jasmine flower song], mode: loop, gain: -8, profile: gramophone, music: true}
  - {key: 摇橹, zh: [摇橹, 划船, 水声], en: [rowing boat oar, oars water, canal water lapping], mode: loop, gain: -12}
  - {key: 电话铃, zh: [电话铃], en: [old telephone ring], mode: event, interval: [60, 200], gain: -12}
  - {key: 爆米花, zh: [爆米花, 爆炒米], en: [popcorn machine bang, loud pop explosion], mode: event, interval: [60, 180], gain: -14}
  - {key: 磨剪子, zh: [磨剪子戗菜刀], en: [knife sharpening, sharpening stone], mode: event, interval: [30, 80], gain: -10}
  - {key: 卖冰棍, zh: [卖冰棍, 冰棍叫卖], en: [ice cream vendor bell, hand bell vendor], mode: event, interval: [30, 80], gain: -8}

# ---------- 环境底层自动规则 ----------
# 每条规则：满足 when 中所有条件时加入 sound（逻辑名称）
ambience_rules:
  - {role: base, sound: 远处人声, when: {region: [上海弄堂, 北京胡同, 厂区大院, 其他, 江南水乡]}, gain: -20}
  - {role: base, sound: 风吹树叶, when: {region: [北方村庄]}, gain: -18}
  - {role: time, sound: 鸟叫, when: {time: [清晨, 上午], weather: [晴, 阴, 雾]}, gain: -16}
  - {role: time, sound: 炉子, when: {time: [清晨, 傍晚]}, gain: -20}
  - {role: time, sound: 蟋蟀, when: {time: [夜晚], season: [夏, 秋], weather: [晴, 阴]}, gain: -14}
  - {role: season, sound: 蝉鸣, when: {season: [夏], time: [上午, 中午, 下午], weather: [晴]}, gain: -16}
  - {role: weather, sound: 雨打瓦片, when: {weather: [小雨]}, gain: -10}
  - {role: weather, sound: 大雨, when: {weather: [大雨]}, gain: -8}
  - {role: weather, sound: 风声, when: {season: [冬]}, gain: -18}
  - {role: weather, sound: 风声, when: {weather: [雪, 雾]}, gain: -20}

# ---------- 敏感内容（永远不自动加入场景） ----------
sensitive_keywords: [防空警报, 空袭, 警报, 批斗, 口号, 标语, 语录, 枪声, 炮声, 爆炸, 军号, 哭声, 哀乐, 葬礼, 丧事, air raid, siren, gunshot, explosion, funeral, struggle session, slogan, propaganda]

# ---------- 控制短语（快速通道，不等 4 秒沉默） ----------
control_phrases:
  quiet: [太吵了, 吵死了, 停一下, 停, 安静, 别响了, 关掉, 小声点, 声音太大, 关了吧]
  resume: [可以了, 继续吧, 再放, 放出来, 声音开开, 打开声音]
  end: [今天就到这儿, 今天就到这里, 就到这儿吧, 我累了, 不想说了, 结束吧, 下次再说]
  undo: [不对, 改回去, 还是原来的, 不是这样, 刚才那样好, 弄错了]
  yes: [对, 对的, 是的, 是, 嗯, 没错, 对对, 就是, 好, 好的, 行]
  no: [不是, 不对, 不要, 不用, 算了]
