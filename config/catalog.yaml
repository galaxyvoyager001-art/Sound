# ---------- 声音词表（检索与在线下载共用） ----------
# key 是逻辑名称；zh/en 关键词用于在线检索；mode: loop | event
sounds:
  - {key: 木梆子, zh: [木梆子, 梆子, 敲梆子, 竹梆], en: [wooden clapper, woodblock knock, temple block], mode: event, interval: [12, 35], gain: -3}
  - {key: 自行车铃, zh: [自行车铃, 车铃], en: [bicycle bell, bike bell ring], mode: event, interval: [10, 30], gain: -5}
  - {key: 三轮车, zh: [三轮车, 人力车], en: [tricycle squeak, rickshaw, bicycle chain creak], mode: event, interval: [25, 60], gain: -8}
  - {key: 叫卖, zh: [叫卖, 吆喝, 小贩叫卖], en: [street vendor calling, hawker shouting, market vendor voice], mode: event, interval: [20, 50], gain: -6}
  - {key: 缝纫机, zh: [缝纫机], en: [sewing machine treadle, old sewing machine], mode: loop, gain: -10}
  - {key: 算盘, zh: [算盘], en: [abacus], mode: event, interval: [15, 40], gain: -10}
  - {key: 搪瓷盆, zh: [搪瓷盆, 脸盆], en: [enamel basin, metal bowl clank, washing basin water], mode: event, interval: [30, 80], gain: -10}
  - {key: 井边打水, zh: [打水, 井水, 水桶], en: [water well bucket, well pulley rope, bucket water splash], mode: event, interval: [30, 70], gain: -8}
  - {key: 压水井, zh: [压水井], en: [hand water pump, manual pump squeak], mode: event, interval: [30, 70], gain: -8}
  - {key: 搓衣板, zh: [搓衣板, 洗衣服], en: [washboard scrubbing, hand washing clothes], mode: event, interval: [20, 50], gain: -10}
  - {key: 风箱, zh: [风箱, 拉风箱], en: [bellows, hand bellows blowing], mode: loop, gain: -12}
  - {key: 炉子, zh: [蜂窝煤炉, 炉火], en: [coal stove crackle, fire crackling, kettle boiling], mode: loop, gain: -14}
  - {key: 挂钟, zh: [挂钟, 钟摆, 滴答], en: [pendulum clock ticking, clock tick, clock chime], mode: loop, gain: -12}
  - {key: 鸡叫, zh: [鸡叫, 公鸡打鸣, 母鸡], en: [chicken clucking, rooster crow, hens], mode: event, interval: [15, 45], gain: -8}
  - {key: 鸭叫, zh: [鸭子叫], en: [ducks quacking], mode: event, interval: [20, 50], gain: -9}
  - {key: 狗叫, zh: [狗叫], en: [dog barking distant, dog bark], mode: event, interval: [30, 90], gain: -10}
  - {key: 猫叫, zh: [猫叫], en: [cat meow], mode: event, interval: [40, 100], gain: -12}
  - {key: 蝉鸣, zh: [蝉鸣, 知了], en: [cicadas, cicada summer], mode: loop, gain: -14, ambience: true}
  - {key: 蟋蟀, zh: [蟋蟀, 虫鸣, 蛐蛐], en: [crickets night, cricket chirping], mode: loop, gain: -14, ambience: true}
  - {key: 鸟叫, zh: [鸟叫, 麻雀], en: [sparrows chirping, birds morning], mode: loop, gain: -14, ambience: true}
  - {key: 雨打瓦片, zh: [雨声, 雨打屋檐, 雨打瓦片], en: [rain on roof tiles, rain on roof, rain dripping], mode: loop, gain: -10, ambience: true}
  - {key: 大雨, zh: [大雨, 暴雨], en: [heavy rain], mode: loop, gain: -10, ambience: true}
  - {key: 风声, zh: [风声, 北风], en: [wind howling, wind outdoor], mode: loop, gain: -16, ambience: true}
  - {key: 风吹树叶, zh: [树叶沙沙], en: [wind in trees leaves rustling], mode: loop, gain: -16, ambience: true}
  - {key: 火车汽笛, zh: [火车汽笛, 火车], en: [steam train whistle, train whistle distant, steam locomotive], mode: event, interval: [60, 180], gain: -10}
  - {key: 工厂汽笛, zh: [工厂汽笛, 厂里拉笛], en: [factory whistle, factory siren steam whistle], mode: event, interval: [120, 300], gain: -12}
