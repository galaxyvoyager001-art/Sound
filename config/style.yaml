  清晨: "清晨，天刚亮，薄雾，光线清冷柔和"
  上午: "上午，阳光明亮温暖"
  中午: "中午，阳光直射，影子很短"
  下午: "下午，阳光斜照，暖黄色"
  傍晚: "傍晚，夕阳，天空橙红，家家户户亮起灯"
  夜晚: "夜晚，月光和窗口昏黄的灯光"
weather_zh:
  晴: "晴天"
  阴: "阴天，天空灰白"
  小雨: "下着小雨，地面湿润反光"
  大雨: "下着大雨，屋檐滴水，地面积水"
  雪: "下雪，房顶和地面积着白雪"
  雾: "有雾，远处朦胧"
season_zh:
  春: "春天，树木发芽，桃花"
  夏: "夏天，树叶浓绿"
  秋: "秋天，落叶金黄"
  冬: "冬天，树枝光秃"
